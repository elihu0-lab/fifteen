<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fifteen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0E2229; --deep:#13303A; --panel:#163742; --edge:#24505B; --text:#EEF4F1; --muted:#93AEAD; --soft:#C9D8D5;
  --win:#6EE7B7; --loss:#FF7A59; --tie:#F6C344; --bo:#B69CFF;
  --c:#6EE7B7;
  --display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --body:'Manrope','Segoe UI',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--night);color:var(--text);font-family:var(--body);-webkit-font-smoothing:antialiased}
body{overflow:hidden}
button{font-family:inherit;cursor:pointer;border:0;color:inherit;background:none;font-size:inherit}
input,textarea{font-family:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--c);outline-offset:2px;border-radius:8px}
#app{position:fixed;inset:0;display:flex;flex-direction:column;
  background:radial-gradient(1200px 800px at 85% 10%, color-mix(in srgb,var(--c) 16%, transparent), transparent 65%), var(--night);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.disp{font-family:var(--display);font-weight:800;letter-spacing:.2px}

/* top bar */
.top{display:flex;align-items:center;gap:14px;padding:12px clamp(14px,2.4vw,32px);border-bottom:1px solid #1E424C;flex:none}
.brand{font-family:var(--display);font-weight:900;font-size:30px;line-height:1}
.brand em{font-style:normal;color:var(--c)}
.rec{display:flex;align-items:baseline;gap:10px;margin-left:8px;min-width:0}
.rec .team{font-weight:700;font-size:15px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec .wlt{font-family:var(--display);font-weight:900;font-size:34px;line-height:1;white-space:nowrap}
.rec .bo{font-size:13px;color:var(--bo);font-weight:700;white-space:nowrap}
.sp{flex:1}
.tbtn{height:40px;padding:0 14px;border-radius:999px;background:#18394383;border:1px solid #2A5662;font-weight:700;font-size:14px;color:var(--soft);display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.tbtn:hover{color:var(--text);border-color:var(--soft)}
.tbtn svg{width:17px;height:17px}
.money{height:40px;padding:0 16px;border-radius:999px;background:color-mix(in srgb,var(--win) 16%, transparent);color:var(--win);font-family:var(--display);font-weight:900;font-size:24px;border:1px solid color-mix(in srgb,var(--win) 40%, transparent)}
@media (max-width:820px){ .tbtn .lbl{display:none} .tbtn{padding:0 11px} .brand{font-size:24px} .rec .team{display:none} .rec .wlt{font-size:28px} }
@media (max-width:560px){ .brand{display:none} .rec{margin-left:0} .rec .bo{display:none} .top{gap:6px} .tbtn{height:38px;padding:0 9px} .money{padding:0 12px;font-size:21px;height:38px} }

.view{flex:1;overflow:auto;display:none;padding:clamp(16px,2.6vw,36px) clamp(14px,2.6vw,40px) 40px}
.view.on{display:block}

/* home */
.home{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:clamp(18px,2.6vw,36px);max-width:1360px;margin:0 auto}
@media (max-width:980px){ .home{grid-template-columns:1fr} }
.card{background:color-mix(in srgb,var(--deep) 88%, transparent);border:1px solid #23474F;border-radius:24px;padding:clamp(18px,2vw,28px)}
.game .kick{font-size:14px;color:var(--muted);font-weight:700}
.game h2{font-family:var(--display);font-weight:900;font-size:clamp(40px,4.4vw,62px);line-height:.92;margin:6px 0 4px}
.game h2 span{color:var(--oc,var(--c))}
.game .meta{color:var(--soft);font-size:15px}
.wkdots{display:flex;gap:10px;margin:18px 0 10px}
.wkdots i{width:34px;height:34px;border-radius:50%;border:3px solid #4E7883;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:800;font-size:14px;color:#082027}
.wkdots i.f{background:var(--win);border-color:var(--win)}
.odds{font-size:15px;color:var(--soft);line-height:1.5}
.odds b{color:var(--text)}
.go{margin-top:22px;width:100%;background:var(--c);color:#082027;font-weight:800;font-size:clamp(20px,2vw,24px);padding:20px 26px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:12px;box-shadow:0 10px 40px color-mix(in srgb,var(--c) 35%, transparent)}
.go svg{width:20px;height:20px}
.quote{margin-top:22px;color:var(--soft);font-style:italic;font-size:16px;line-height:1.5}
.quote small{display:block;font-style:normal;color:var(--muted);font-weight:600;font-size:12px;margin-top:3px}
.nos{margin-top:14px}
.link{color:var(--soft);font-weight:700;text-decoration:underline;text-underline-offset:3px;font-size:14px}

.lineup .hd{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.lineup h3{font-family:var(--display);font-weight:900;font-size:clamp(34px,3.6vw,48px);line-height:.9}
.lineup .hint{color:var(--muted);font-size:13.5px;margin-top:4px}
.chips{display:flex;gap:8px}
.chip{padding:9px 16px;border-radius:999px;border:1.5px solid #3A6470;font-weight:700;font-size:14px;color:var(--soft)}
.chip.on{background:var(--text);color:#0E2229;border-color:var(--text)}
.slot{display:grid;grid-template-columns:78px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 0;border-top:1px solid #23474F}
.slot:first-of-type{margin-top:12px}
.slot .ic{width:78px;height:58px;border-radius:14px;background:color-mix(in srgb,var(--ec) 15%, transparent);display:flex;align-items:center;justify-content:center}
.slot .ic svg{width:72px;height:54px}
.slot .tag{font-size:12.5px;color:var(--muted);font-weight:700}
.slot .tag b{color:var(--ec);font-weight:800}
.nm{display:flex;align-items:center;gap:4px;margin-top:2px}
.nm span{font-weight:800;font-size:17px;flex:1;min-width:0}
.arr{width:34px;height:34px;border-radius:50%;background:#1A3A44;font-size:20px;font-weight:800;color:var(--soft);flex:none;line-height:1}
.arr:hover{background:#264C58;color:var(--text)}
.stepper{display:flex;align-items:center;gap:2px;background:#18343E;border-radius:999px;padding:4px}
.stepper button{width:36px;height:36px;border-radius:50%;font-size:22px;font-weight:700;color:var(--soft)}
.stepper button:hover{background:#264C58;color:var(--text)}
.stepper .v{min-width:52px;text-align:center;line-height:1}
.stepper .v b{display:block;font-family:var(--display);font-weight:900;font-size:26px;color:var(--ec,var(--text))}
.stepper .v small{font-size:10.5px;color:var(--muted);font-weight:700}
@media (max-width:520px){ .slot{grid-template-columns:56px minmax(0,1fr)} .slot .ic{width:56px;height:46px} .slot .ic svg{width:52px;height:40px} .slot .stepper{grid-column:2;justify-self:start} }

/* workout */
#work{padding:0;overflow:hidden}
#work.on{display:flex;flex-direction:column}
.wh{display:flex;align-items:center;gap:14px;padding:14px clamp(14px,2.4vw,32px) 0;flex-wrap:wrap}
.wh .big{font-family:var(--display);font-weight:900;font-size:clamp(24px,2.4vw,32px)}
.wh .sm{color:var(--soft);font-weight:600;font-size:15px}
.segs{display:grid;grid-template-columns:repeat(15,1fr);gap:5px;margin:12px clamp(14px,2.4vw,32px) 0}
.seg{height:10px;border-radius:5px;background:#244550;overflow:hidden;position:relative}
.seg i{position:absolute;inset:0;width:0;background:var(--sc)}
.wmain{flex:1;min-height:0;display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:clamp(20px,4vw,64px);padding:12px clamp(14px,3vw,48px)}
.ring{position:relative;width:min(40vw,56vh);aspect-ratio:1;container-type:inline-size}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .trk{stroke:#21424C}
.ring .arc{stroke:var(--c);stroke-linecap:round}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .num b{font-family:var(--display);font-weight:900;font-size:50cqw;line-height:.8;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.ring .num span{font-size:max(12px,3.6cqw);color:var(--muted);margin-top:4cqw;font-weight:700}
.ring.hot .num b{color:var(--c)}
.paused{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:var(--display);font-weight:900;font-size:40px;background:var(--night);padding:6px 22px;border-radius:14px;display:none}
.is-paused .paused{display:block}
.ex .mv{font-size:16px;color:var(--muted);font-weight:700}
.ex .icon svg{width:min(28vw,300px);height:auto;aspect-ratio:104/81;margin-left:-12px}
.ex .name{font-family:var(--display);font-weight:900;font-size:clamp(36px,5.6vw,84px);line-height:.92}
.ex .tg{display:flex;align-items:baseline;gap:12px;margin-top:10px}
.ex .tg b{font-family:var(--display);font-weight:900;font-size:clamp(44px,5vw,70px);color:var(--c);line-height:1}
.ex .tg span{font-size:18px;color:var(--soft);font-weight:700}
.nx{display:flex;align-items:center;gap:10px;margin-top:16px;color:var(--muted);font-size:15px;font-weight:700}
.nx svg{width:52px;height:40px}
.nx b{color:var(--text)}
.wb{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:0 clamp(14px,2.4vw,32px) 18px;flex-wrap:wrap}
.wq{font-size:16px;font-style:italic;color:var(--soft);max-width:520px}
.ctrls{display:flex;gap:8px;flex-wrap:wrap}
.cb{height:48px;padding:0 18px;border-radius:999px;background:#1C3B45;font-weight:800;font-size:15px}
.cb:hover{background:#264C58}
.cb.pri{background:var(--c);color:#082027}
.cb.off{opacity:.45}
@media (orientation:portrait),(max-width:760px){
  .wmain{grid-template-columns:1fr;justify-items:center;text-align:center;align-content:center;gap:8px}
  .ring{width:min(70vw,38vh)}
  .ex{align-items:center;display:flex;flex-direction:column}
  .ex .icon svg{width:min(44vw,180px);margin:0}
  .ex .tg{justify-content:center}
  .wq{display:none}
  .wb{justify-content:center}
}

/* log */
.logw{max-width:1100px;margin:0 auto}
.logw h1{font-family:var(--display);font-weight:900;font-size:clamp(44px,6vw,84px);line-height:.9}
.logw .sub{color:var(--soft);font-size:17px;margin:10px 0 22px}
.lrow{display:grid;grid-template-columns:70px minmax(140px,1fr) repeat(3,auto) 56px;gap:10px 14px;align-items:center;padding:8px 0;border-top:1px solid #23474F}
.lrow .ic{width:70px;height:52px;border-radius:12px;background:color-mix(in srgb,var(--ec) 15%, transparent);display:flex;align-items:center;justify-content:center}
.lrow .ic svg{width:64px;height:48px}
.lrow .n{font-weight:800;font-size:16px}
.lrow .n small{display:block;color:var(--muted);font-weight:600;font-size:12px}
.lrow .tot{font-family:var(--display);font-weight:900;font-size:28px;color:var(--ec);text-align:right}
.lrow .stepper .v input{width:52px;background:none;border:0;color:var(--text);text-align:center;font-family:var(--display);font-weight:900;font-size:26px;-moz-appearance:textfield}
.lrow input::-webkit-outer-spin-button,.lrow input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.lhd{display:grid;grid-template-columns:70px minmax(140px,1fr) repeat(3,auto) 56px;gap:14px;color:var(--muted);font-size:13px;font-weight:700}
@media (max-width:760px){ .lrow,.lhd{grid-template-columns:52px 1fr 1fr 1fr} .lhd{display:none} .lrow .ic{width:52px;height:42px} .lrow .ic svg{width:48px;height:36px} .lrow .n{grid-column:2 / span 3} .lrow .tot{display:none} .lrow .stepper button{width:30px;height:30px} .lrow .stepper .v{min-width:38px} .lrow .stepper .v input{width:38px;font-size:22px} }
@media (max-width:760px){ .lrow{grid-template-columns:repeat(3,minmax(0,1fr))} .lrow .ic{display:none} .lrow .n{grid-column:1 / -1} }
.lfoot{display:flex;gap:14px;align-items:center;margin-top:24px;flex-wrap:wrap}
.btn{background:var(--c);color:#082027;font-weight:800;font-size:18px;padding:16px 30px;border-radius:999px}
.btn.ghost{background:none;border:1.5px solid #3A6470;color:var(--soft)}
.btn.sm{font-size:15px;padding:11px 20px}

/* sheets */
.sheet{position:fixed;inset:0;background:rgba(5,16,20,.74);display:none;align-items:flex-start;justify-content:center;z-index:20;padding:clamp(10px,3vh,40px) 10px;overflow:auto}
.sheet.on{display:flex}
.sc{width:min(1100px,100%);background:var(--deep);border:1px solid #2B5560;border-radius:24px;padding:clamp(18px,2.4vw,32px);position:relative}
.sc.narrow{width:min(560px,100%)}
.sh{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.sh h2{font-family:var(--display);font-weight:900;font-size:clamp(32px,3.4vw,44px);line-height:.95}
.x{width:44px;height:44px;border-radius:50%;background:#1C3B45;font-size:22px;font-weight:700;flex:none}
.sc p{color:var(--soft);line-height:1.55;font-size:15px}
.sc h3{font-size:16px;margin:20px 0 8px}
.muted{color:var(--muted)}

/* wallet */
.wbal{font-family:var(--display);font-weight:900;font-size:72px;color:var(--win);line-height:1}
.cap{height:10px;background:#21424C;border-radius:5px;overflow:hidden;margin:10px 0 4px}
.cap i{display:block;height:100%;background:var(--win)}
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.wgrid div{background:#183A44;border-radius:14px;padding:12px 14px}
.wgrid b{display:block;font-family:var(--display);font-weight:900;font-size:26px}
.wgrid small{color:var(--muted);font-weight:600;font-size:12.5px}
.flav{font-style:italic;color:var(--soft);margin:14px 0 0;font-size:15px;line-height:1.5}
.spend{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.spend input{height:46px;border-radius:12px;border:1px solid #2B5560;background:#0E2229;color:var(--text);padding:0 12px;font-size:16px}
.spend input.amt{width:110px}
.spend input.note{flex:1;min-width:140px}
.tx{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
.tx td{padding:7px 4px;border-top:1px solid #24505B}
.tx td.a{text-align:right;font-weight:800;white-space:nowrap}
.pos{color:var(--win)} .neg{color:var(--loss)}

/* setup */
.setup{max-width:1180px;margin:0 auto}
.setup h1{font-family:var(--display);font-weight:900;font-size:clamp(46px,6vw,86px);line-height:.9}
.setup .sub{color:var(--soft);font-size:17px;margin:10px 0 24px;max-width:60ch;line-height:1.5}
.divs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:980px){ .divs{grid-template-columns:repeat(2,minmax(0,1fr))} }
.div h4{font-size:13px;color:var(--muted);font-weight:800;margin-bottom:8px}
.team{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:14px;border:1.5px solid #23474F;background:#12303A;margin-bottom:8px;text-align:left;font-weight:800;font-size:16px}
.team:hover{border-color:var(--tc)}
.team.on{border-color:var(--tc);background:color-mix(in srgb,var(--tc) 22%, #12303A)}
.mono{width:34px;height:34px;border-radius:10px;background:var(--tc);color:#0E2229;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:900;font-size:20px;flex:none}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px}
@media (max-width:700px){ .modes{grid-template-columns:1fr} }
.mode{padding:18px 20px;border-radius:18px;border:1.5px solid #2B5560;background:#12303A;text-align:left}
.mode.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%, #12303A)}
.mode b{font-family:var(--display);font-weight:900;font-size:30px;display:block}
.mode .rcm{display:inline-block;font-size:12px;font-weight:800;color:#082027;background:var(--c);border-radius:999px;padding:3px 10px;margin-left:6px;vertical-align:6px;font-family:var(--body)}
.mode span{color:var(--soft);font-size:15px;line-height:1.45;display:block;margin-top:4px}
.lockn{color:var(--muted);font-size:14px;margin:16px 0 0}

/* league */
.lg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:760px){ .lg{grid-template-columns:1fr} }
.st{width:100%;border-collapse:collapse;font-size:14.5px}
.st th{text-align:right;color:var(--muted);font-weight:700;font-size:12px;padding:4px 6px}
.st th:first-child{text-align:left}
.st td{padding:7px 6px;border-top:1px solid #24505B;text-align:right;font-variant-numeric:tabular-nums}
.st td:first-child{text-align:left;font-weight:700}
.st tr.me td{background:color-mix(in srgb,var(--c) 14%, transparent)}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--tc);margin-right:8px}
.seed{font-size:11px;color:var(--muted);margin-left:6px;font-weight:800}
.brk{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:8px}
@media (max-width:760px){ .brk{grid-template-columns:1fr} }
.brk h4{font-size:13px;color:var(--muted);margin-bottom:6px}
.mu{background:#12303A;border-radius:12px;padding:8px 12px;margin-bottom:8px;font-size:14.5px}
.mu div{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
.mu .w{font-weight:800}
.mu .l{color:var(--muted)}
.mu.me{outline:2px solid var(--c)}

/* history */
.sumg{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:16px}
@media (max-width:760px){ .sumg{grid-template-columns:repeat(2,minmax(0,1fr))} }
.sumg div{background:#183A44;border-radius:14px;padding:12px 14px}
.sumg b{display:block;font-family:var(--display);font-weight:900;font-size:30px;line-height:1.05}
.sumg small{color:var(--muted);font-weight:600;font-size:12.5px}
.hg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:980px){ .hg{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:560px){ .hg{grid-template-columns:1fr} }
.hw{display:grid;grid-template-columns:44px repeat(3,40px) minmax(0,1fr);gap:6px;align-items:center;background:#12303A;border-radius:12px;padding:7px 10px;border-left:4px solid var(--rc,#2B5560)}
.hw .wn{font-family:var(--display);font-weight:900;font-size:18px;line-height:1}
.hw .wn small{display:block;font-family:var(--body);font-size:10px;color:var(--muted);font-weight:700}
.mg{height:30px;border-radius:6px;background:#0E2229;display:flex;align-items:flex-end;gap:2px;padding:3px}
.mg i{flex:1;border-radius:2px 2px 0 0;background:var(--bc);min-height:2px}
.mg.empty{background:none;border:1.5px dashed #2E5964}
.hw .res{text-align:right;line-height:1.15;min-width:0}
.hw .res b{font-family:var(--display);font-weight:900;font-size:17px;color:var(--rc)}
.hw .res small{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seas{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.trophy{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.trophy span{background:color-mix(in srgb,var(--tie) 18%, transparent);color:var(--tie);border:1px solid color-mix(in srgb,var(--tie) 45%, transparent);border-radius:999px;padding:6px 12px;font-weight:800;font-size:14px}

/* sync */
.sync textarea{width:100%;height:120px;background:#0E2229;color:var(--soft);border:1px solid #2B5560;border-radius:12px;padding:10px;font-size:12px;font-family:ui-monospace,Menlo,monospace}
.stamps{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 4px}
.stamps div{background:#183A44;border-radius:14px;padding:12px 14px}
.stamps b{display:block;font-size:15px}

.tp .tph{display:flex;gap:16px;align-items:center}

.tpm{font-size:15px;color:var(--soft)}

    const row = {w, label:'Week '+w, short:'W'+w, ws, sess, cnt, state: final ? 'final' : live ? 'live' : 'upcoming'};
    sched[w-1].forEach(([a,b]) => {

      if (!final) return;

          if (a === s.team || b === s.team){ const opp = a === s.team ? b : a; g = userGame(w, opp, cnt, true); }

/* season */
function simLeague(s){
  const thisWeek = weekOf(new Date());
  const ro = rngFor(s.seed,'order'); const order = L3_TEAMS.slice(); for (let i=order.length-1;i>0;i--){ const j = Math.floor(ro()*(i+1)); [order[i],order[j]] = [order[j],order[i]]; }
  const rec = {}; L3_TEAMS.forEach(t => rec[t] = {team:t, w:0,l:0,t:0,bo:0,pf:0,pa:0, log:[]});
  let arr = order.slice(); const sched = [];
  for (let w=0; w<15; w++){ const pairs = []; for (let i=0;i<16;i++) pairs.push(w % 2 ? [arr[31-i], arr[i]] : [arr[i], arr[31-i]]); sched.push(pairs); arr = [arr[0], arr[31], ...arr.slice(1,31)]; }
  // dynamic strength and power rankings
  const drift = {}; L3_TEAMS.forEach(t => drift[t] = 0);
  const RT = {}, RANKS = {}, TIERS = {};
  let cur = {}; L3_TEAMS.forEach(t => cur[t] = T3[t].rank);
  const setWeek = w => {
    L3_TEAMS.forEach(t => { const r = rngFor(s.seed, 'drift', w, t); drift[t] = drift[t]*.85 + gauss(r)*.05; });
    RT[w] = {}; L3_TEAMS.forEach(t => RT[w][t] = baseR(T3[t].rank) + drift[t]);
    RANKS[w] = Object.assign({}, cur); TIERS[w] = {}; L3_TEAMS.forEach(t => TIERS[w][t] = rankTier(cur[t]));
  };
  const rerank = () => {
    const score = t => { const x = rec[t], g = x.w + x.l + x.t; const prior = baseR(T3[t].rank); if (!g) return prior;
      const perf = ((x.w + x.t/2)/g - .5)*1.1 + ((x.pf - x.pa)/g)/14*.4; const wt = g/(g + 4); return prior*(1-wt) + perf*wt; };
    const order2 = L3_TEAMS.slice().sort((a,b) => score(b) - score(a) || T3[a].rank - T3[b].rank);
    cur = {}; order2.forEach((t,i) => cur[t] = i+1);
  };
  const Rof = (w, t, cnt) => t === s.team ? USER_R[cnt] : RT[w][t] + .30*(practice(s, w, t, TIERS[w][t]).filter(Boolean).length/3 - .65);
  const apply = (a, b, sa, sb, boA, boB, w, short) => { const A = rec[a], B = rec[b]; A.pf += sa; A.pa += sb; B.pf += sb; B.pa += sa;
    if (sa > sb){ A.w++; B.l++; if (boA) A.bo++; } else if (sb > sa){ B.w++; A.l++; if (boB) B.bo++; } else { A.t++; B.t++; }
    A.log.push({w, short, opp:b, us:sa, them:sb}); B.log.push({w, short, opp:a, us:sb, them:sa}); };
  const result = (w, a, b, playoff, cnt) => {
    const RA = Rof(w, a, cnt), RB = Rof(w, b, cnt);
    const g = playGame(s, w, a, b, playoff, cnt, false, RA, RB); const sa = g.sc[0], sb = g.sc[1];
    const boA = a === s.team ? (cnt === 3 && sa > sb) : sa - sb >= 17, boB = b === s.team ? (cnt === 3 && sb > sa) : sb - sa >= 17;
    return {a, b, sa, sb, ot:g.ot, boA, boB, RA, RB};
  };
  const rows = [], weeks = []; let lastSet = 1;
  const userView = (res) => { const flip = res.b === s.team; return flip ? {sa:res.sb, sb:res.sa, ot:res.ot, boA:res.boB} : {sa:res.sa, sb:res.sb, ot:res.ot, boA:res.boA}; };
  for (let w=1; w<=15; w++){
    setWeek(w); lastSet = w;
    const ws = addDays(s.start, 7*(w-1)); const k = kickOf(s, w);
    const sess = sessionsInWeek(ws); const cnt = k ? k.cnt : Math.min(3, sess.length);
    const final = ws < thisWeek || (k && kickElapsed(k) >= LIVE_MS);
    const state = final ? 'final' : ws === thisWeek ? 'live' : 'upcoming';
    const games = sched[w-1].map(([a,b]) => { const res = final ? result(w, a, b, false, cnt) : null; if (res) apply(a, b, res.sa, res.sb, res.boA, res.boB, w, 'W'+w); return {a, b, res}; });
    const ug = games.find(g => g.a === s.team || g.b === s.team);
    rows.push({w, label:'Week '+w, short:'W'+w, ws, sess, cnt, opp: ug.a === s.team ? ug.b : ug.a, state, game: ug.res ? userView(ug.res) : null, kick:k, a:ug.a, b:ug.b});
    weeks.push({w, ws, state, games});
    if (final) rerank();
  }
  const cmp = (x,y) => { const px = (x.w + x.t/2)/Math.max(1,x.w+x.l+x.t), py = (y.w + y.t/2)/Math.max(1,y.w+y.l+y.t);
    return (py-px) || (y.w-x.w) || (y.bo-x.bo) || ((y.pf-y.pa)-(x.pf-x.pa)) || T3[x.team].rank - T3[y.team].rank; };
  const standings = L3_DIVS.map(d => d.teams.map(t => rec[t]).sort(cmp));
  const regDone = rows[14].state === 'final';
  let seedLabel = {}, bracket = [], status = regDone ? 'missed' : 'regular', champion = null;
  if (regDone){
    const confSeeds = [0,1].map(ci => standings.filter((_,di) => L3_DIVS[di].conf === ci).map(t => t[0]).sort(cmp).map(x => x.team));
    confSeeds.forEach((arr2, ci) => arr2.forEach((t,i) => seedLabel[t] = `${L3_CONF[ci].short[0]}${i+1}`));
    if (Object.keys(seedLabel).includes(s.team)) status = 'playoffs';
    const names = ['Division Playoffs','Conference Championships','The Championship'];
    let round = [[confSeeds[0][0],confSeeds[0][3]],[confSeeds[0][1],confSeeds[0][2]],[confSeeds[1][0],confSeeds[1][3]],[confSeeds[1][1],confSeeds[1][2]]];
    for (let kx=0; kx<3 && round; kx++){
      const w = 16 + kx; setWeek(w); lastSet = w;
      const ws = addDays(s.start, 7*(w-1)); const k = kickOf(s, w);
      const sess = sessionsInWeek(ws); const cnt = k ? k.cnt : Math.min(3, sess.length);
      const final = ws < thisWeek || (k && kickElapsed(k) >= LIVE_MS);
      const state = final ? 'final' : ws === thisWeek ? 'live' : 'upcoming';
      const games = round.map(([a,b]) => { const res = final ? result(w, a, b, true, cnt) : null; if (res){ rec[a].log.push({w, short:['DP','CC','F'][kx], opp:b, us:res.sa, them:res.sb}); rec[b].log.push({w, short:['DP','CC','F'][kx], opp:a, us:res.sb, them:res.sa}); } return {a, b, g:res}; });
      bracket.push({name:names[kx], w, ws, state, games});
      weeks.push({w, ws, state, games:games.map(g => ({a:g.a, b:g.b, res:g.g})), playoff:true, name:names[kx]});
      const ug = games.find(x => x.a === s.team || x.b === s.team);
      if (ug){
        rows.push({w, label:names[kx], short:['DP','CC','F'][kx], ws, sess, cnt, opp: ug.a === s.team ? ug.b : ug.a, state, game: ug.g ? userView(ug.g) : null, playoff:true, kick:k, a:ug.a, b:ug.b});
        if (final){ const won = (ug.g.a === s.team && ug.g.sa > ug.g.sb) || (ug.g.b === s.team && ug.g.sb > ug.g.sa); if (!won) status = 'eliminated'; else if (kx === 2) status = 'champion'; }
      }
      if (!final) break;
      const winners = games.map(x => x.g.sa > x.g.sb ? x.a : x.b);
      if (kx === 2){ champion = winners[0]; round = null; }
      else if (kx === 0) round = [[winners[0], winners[1]], [winners[2], winners[3]]];
      else round = [[winners[0], winners[1]]];
    }
  }
  const lastWs = addDays(s.start, 7*17);
  const over = ['missed','eliminated','champion'].includes(status) || lastWs < thisWeek;
  // the week we are in (or last one simulated) drives the "current" rank/tier
  const nowW = (rows.find(r => r.ws === thisWeek) || {}).w || Math.min(lastSet, Math.max(1, Math.floor((fromKey(thisWeek) - fromKey(s.start))/6048e5) + 1));
  const wK = Math.min(nowW, lastSet);
  const rankNow = RANKS[wK] || cur, prevRank = RANKS[Math.max(1, wK-1)] || rankNow;
  const finalCur = rows.length && rows.every(r => r.state === 'final') ? cur : rankNow;
  const move = {}; L3_TEAMS.forEach(t => move[t] = (prevRank[t] || 0) - (finalCur[t] || 0));
  const tierAt = (w, t) => (TIERS[Math.min(w, lastSet)] || TIERS[1])[t];
  const RexpOf = (w, t) => { const ww = Math.min(w, lastSet); const ws = addDays(s.start, 7*(w-1)); const rev = revealedDays(ws); const pr = practice(s, w, t, tierAt(w,t));
    const exp = pr.slice(0, rev).filter(Boolean).length + (3 - rev)*TIER_P[tierAt(w,t)]; return RT[ww][t] + .30*(exp/3 - .65); };
  return {s, rows, weeks, rec, standings, seeds:null, seedLabel, bracket, status, over, champion, me: rec[s.team], league3:true,
    rankNow:finalCur, move, tierAt, Rof, RexpOf, RT, lastSet, strength:t => RT[Math.min(wK, lastSet)][t]};
}

/* odds estimate */
const EST = new Map();
function estimate(st, w, opp, cnt, playoff){
  const RB = st.RexpOf(w, opp); const ws = addDays(st.s.start, 7*(w-1));
  const key = [st.s.id, w, opp, cnt, revealedDays(ws), playoff, RB.toFixed(3)].join('|'); if (EST.has(key)) return EST.get(key);
  let wins = 0, n = 300;
  for (let i=0;i<n;i++){ const g = simGame('est'+i+key, {name:'A',abbr:'A',R:USER_R[cnt],at:ATTRS[st.s.team]}, {name:'B',abbr:'B',R:RB,at:ATTRS[opp]}, {playoff}); if (g.sc[0] > g.sc[1]) wins++; else if (g.sc[0] === g.sc[1]) wins += .5; }
  const p = wins/n; EST.set(key, p); return p;
}

/* ================= wallet ================= */
function walletCalc(){
  const ev = []; const wc = {}; const monthOfWeek = {};
  data.sessions.forEach(s => {
    const wk = weekOf(s.d); const c = (wc[wk] = (wc[wk]||0) + 1); const mk = monthOf(s.d);
    if (c <= 3) ev.push({t:s.d, amt:1, type:'Workout', mk});
    if (c === 3) ev.push({t:s.d, amt:1, type:'3-workout week bonus', mk});
  });
  const nowM = monthOf(new Date());
  if (data.sessions.length){
    let m = monthOf(data.sessions[0].d);
    while (m < nowM){
      const [y,mo] = m.split('-').map(Number);
      const first = new Date(y, mo-1, 1), nextFirst = new Date(y, mo, 1);
      const mondays = []; for (let d = new Date(first); d < nextFirst; d.setDate(d.getDate()+1)) if (d.getDay() === 1) mondays.push(dkey(d));
      if (mondays.length && mondays.every(k => (wc[k]||0) >= 3)) ev.push({t:nextFirst.toISOString(), amt:20, type:'Perfect month bonus', mk:m});
      m = `${nextFirst.getFullYear()}-${pad(nextFirst.getMonth()+1)}`;
    }
  }
  data.spends.forEach(sp => ev.push({t:sp.d, amt:-sp.amt, type:'Spent', note:sp.note, spend:true}));
  ev.sort((a,b) => a.t < b.t ? -1 : a.t > b.t ? 1 : 0);
  let bal = 0; const me = {}; const tx = [];
  ev.forEach(e => {
    if (e.spend){ const s = Math.min(bal, -e.amt); bal -= s; tx.push({t:e.t, type:'Spent', note:e.note, amt:-s}); return; }
    const used = me[e.mk] || 0; const room = Math.min(20 - used, 25 - bal);
    const add = Math.max(0, Math.min(e.amt, room));
    if (e.type === 'Perfect month bonus' && add === 0) return;
    let note = '';
    if (add < e.amt && e.type !== 'Perfect month bonus') note = (20 - used) <= (25 - bal) ? 'Monthly max reached' : 'Wallet full';
    if (e.type === 'Perfect month bonus') note = 'Tops the month up to $20';
    bal += add; me[e.mk] = used + add;
    tx.push({t:e.t, type:e.type, amt:add, lost:e.amt-add, note});
  });
  const wk = weekOf(new Date());
  const [y,mo] = nowM.split('-').map(Number);
  const mondaysSoFar = []; for (let d = new Date(y,mo-1,1); dkey(d) <= dkey(new Date()); d.setDate(d.getDate()+1)) if (d.getDay() === 1) mondaysSoFar.push(dkey(d));
  const pastWeeksPerfect = mondaysSoFar.filter(k => k < wk).every(k => (wc[k]||0) >= 3);
  return {bal, tx, monthEarned: me[nowM] || 0, weekCount: wc[wk] || 0, perfectOnTrack: pastWeeksPerfect};
}

/* ---------- workout engine ---------- */
let phase = 'idle', accum = 0, t0 = 0, running = false, timer = null, lastShown = null, lastMin = -1, plan = null, wake = null;
const elapsed = () => accum + (running ? (performance.now() - t0)/1000 : 0);
async function lockWake(){ try { if ('wakeLock' in navigator) wake = await navigator.wakeLock.request('screen'); } catch(e){ wake = null; } }
function unlockWake(){ try { wake && wake.release(); } catch(e){} wake = null; }
function syncToggles(){ $('soundBtn').classList.toggle('off', !data.prefs.sound); $('voiceBtn').classList.toggle('off', !data.prefs.voice); }

function start(){
  audio();
  plan = SLOTS.map(s => { const v = data.prefs.lineup[s.id]; return {slot:s, v, x:V[v], tg:target(v)}; });
  plan.kind = lineupKind();
  $('segs').innerHTML = Array.from({length:SLOTS.length*ROUNDS}, (_,i) => `<div class="seg" style="--sc:${SLOTS[i%SLOTS.length].color}"><i></i></div>`).join('');
  $('lineLbl').textContent = plan.kind;
  show('work'); $('work').classList.remove('is-paused');
  phase = 'prep'; accum = 0; t0 = performance.now(); running = true; lastShown = null; lastMin = -1;
  $('workQuote').textContent = '“' + quote()[0] + '”';
  $('pauseBtn').textContent = 'Pause'; syncToggles(); fsLabel(); lockWake();
  clearInterval(timer); timer = setInterval(tick, 50); tick();
  speak('Get ready. First up, ' + plan[0].x.name);
}
function showEx(i, prep){
  const p = plan[i % SLOTS.length], r = Math.floor(i / SLOTS.length), n = plan[(i+1) % SLOTS.length];
  setColor(p.slot.color);
  $('mvLbl').textContent = prep ? 'First up' : `${p.slot.label} · move ${(i%SLOTS.length)+1} of ${SLOTS.length}`;
  $('exIcon').innerHTML = svg(p.x.pose, p.slot.color);
  $('exName').textContent = p.x.name;
  $('exTarget').textContent = p.tg; $('exUnit').textContent = p.x.unit;
  $('nextBox').innerHTML = prep ? '' : (i < SLOTS.length*ROUNDS - 1 ? `${svg(n.x.pose, n.slot.color)}<span>Next up: <b>${esc(n.x.name)}</b></span>` : '<span><b>Last minute.</b> Finish clean.</span>');
  $('roundLbl').textContent = prep ? '' : `Round ${r+1} of ${ROUNDS}`;
  $('minLbl').textContent = prep ? 'Get ready' : `Minute ${i+1} of ${SLOTS.length*ROUNDS}`;
}
function tick(){
  const t = elapsed();
  if (phase === 'prep'){
    const left = Math.max(0, PREP - t), shown = Math.ceil(left);
    if (lastMin !== 'prep'){ showEx(0, true); lastMin = 'prep'; $('secsLbl').textContent = 'starting in'; }
    if (shown !== lastShown){ if (shown >= 1 && shown <= 5 && running) SND.tick(false); lastShown = shown; }
    ring(left/PREP, shown, true);
    if (left <= 0){ phase = 'run'; accum = 0; t0 = performance.now(); lastShown = null; lastMin = -1; }
    return;
  }
  if (phase !== 'run') return;
  if (t >= TOTAL) return finish(true);
  const m = Math.floor(t/60), inMin = t - m*60, left = 60 - inMin, shown = Math.ceil(left);
  if (m !== lastMin){
    lastMin = m; showEx(m, false); $('secsLbl').textContent = 'seconds left';
    if (running) SND.minute();
    const p = plan[m % SLOTS.length]; speak(`${p.x.name}. ${p.tg}`);
    if (m % SLOTS.length === 0 && m > 0) $('workQuote').textContent = '“' + quote()[0] + '”';
    lastShown = shown;
  }
  if (shown !== lastShown){ if (running){ if (shown === 10) SND.ten(); else if (shown <= 5 && shown >= 1) SND.tick(shown === 1); } lastShown = shown; }
  ring(left/60, shown, shown <= 10);
  $('pctLbl').textContent = Math.min(100, Math.floor(t/TOTAL*100)) + '%';
  const segs = $('segs').children;
  for (let i=0;i<segs.length;i++) segs[i].firstChild.style.width = (i < m ? 100 : i === m ? inMin/60*100 : 0) + '%';
}
function ring(frac, shown, hot){ $('arc').style.strokeDashoffset = (1156.1*(1-frac)).toFixed(1); $('secs').textContent = shown; $('ring').classList.toggle('hot', !!hot); }
function pause(){
  if (phase !== 'prep' && phase !== 'run') return;
  if (running){ accum = elapsed(); running = false; $('pauseBtn').textContent = 'Resume'; $('work').classList.add('is-paused'); }
  else { t0 = performance.now(); running = true; $('pauseBtn').textContent = 'Pause'; $('work').classList.remove('is-paused'); audio(); }
}
function skip(){
  if (phase === 'prep'){ accum = PREP; t0 = performance.now(); tick(); return; }
  if (phase !== 'run') return;
  const next = (Math.floor(elapsed()/60)+1)*60; accum = next; t0 = performance.now();
  if (next >= TOTAL) return finish(true); tick();
}
function finish(complete){
  clearInterval(timer); running = false; phase = 'done'; unlockWake();
  if (complete){ SND.finish(); speak('Done. Nice work.'); }
  renderLog(complete); show('log'); setColor('#6EE7B7');
}

    plan.forEach((p,si) => { sess.lineup[p.slot.id] = p.v; sess.sets[p.slot.id] = vals[si]; sess.tg[p.slot.id] = p.tg; if (vals[si][0] > 0) data.prefs.targets[p.v] = vals[si][0]; });

    else if (st && n <= 3){ const row = st.rows.find(r => r.ws === weekOf(new Date())); if (row && row.opp){ const p = userProb('ags', n, !!row.playoff, st.rating[row.opp], st.me.bo); msg = `Win odds now ${Math.round(p.w*100)}% vs the ${row.opp}.`; } }

  const br = st.bracket.length ? `<h3>Playoffs</h3><div class="brk">${st.bracket.map(rd => `<div><h4>${rd.name} · ${rd.state === 'final' ? 'final' : rd.state === 'live' ? 'this week' : 'upcoming'}</h4>
    ${rd.games.map(g => { const me = g.a === st.s.team || g.b === st.s.team; const fin = g.g; const aw = fin && fin.sa > fin.sb, bw = fin && fin.sb > fin.sa;
      return `<div class="mu ${me ? 'me' : ''}"><div class="${fin ? (aw ? 'w' : 'l') : ''}"><span>${teamCell(g.a, st)}</span><span>${fin ? fin.sa : ''}</span></div><div class="${fin ? (bw ? 'w' : 'l') : ''}"><span>${teamCell(g.b, st)}</span><span>${fin ? fin.sb + (fin.ot ? ' OT' : '') : ''}</span></div></div>`; }).join('')}</div>`).join('')}</div>` +
    (st.champion ? `<div class="trophy" style="margin-top:10px"><span>🏆 ${esc(st.champion)} are champions</span></div>` : '')
    : `<p class="muted" style="margin-top:14px">Top 8 make the playoffs: the 4 division winners plus the 4 best other records. Ties in the standings are broken by wins, then blowouts, then point differential.</p>`;
  openSheet(head('League') + `<p style="margin-bottom:12px"><b>${esc(st.s.team)}</b> · ${stat} · ${st.s.mode === 'std' ? 'Standard' : 'Any Given Sunday'} mode</p><div class="lg">${tables}</div>${br}
    ${st.over ? '<div class="row"><button class="btn sm" data-goto="setup">Start next season</button></div>' : ''}`);
}

/* history */
let histSeason = null;
function mini(sess){
  if (!sess) return '<div class="mg empty"></div>';
  return `<div class="mg">${SLOTS.map(s => { const v = (sess.sets[s.id]||[]); const avg = v.length ? v.reduce((a,b)=>a+b,0)/v.length : 0; const tg = (sess.tg && sess.tg[s.id]) || 1; const h = Math.max(8, Math.min(100, avg/tg*80)); return `<i style="--bc:${s.color};height:${h}%"></i>`; }).join('')}</div>`;
}
function renderHistory(){
  const seasons = data.seasons;
  const id = histSeason && seasons.find(s => s.id === histSeason) ? histSeason : (seasons.length ? seasons[seasons.length-1].id : null);
  const titles = seasons.map(s => simSeason(s)).filter(x => x.status === 'champion');
  let body = '';
  if (id){
    const st = simSeason(seasons.find(s => s.id === id));
    const done = st.rows.filter(r => r.state === 'final');
    const workouts = st.rows.reduce((a,r) => a + Math.min(3, r.sess.length), 0);
    const reps = st.rows.reduce((a,r) => a + r.sess.reduce((b,s) => b + Object.values(s.sets).flat().reduce((x,y)=>x+y,0), 0), 0);
    const possible = Math.max(1, done.length*3 + (st.rows.find(r => r.state === 'live') ? 3 : 0));
    const m = st.me;
    body = `<div class="sumg"><div><b>${m.w}–${m.l}–${m.t}</b><small>Record</small></div><div><b style="color:var(--bo)">${m.bo}</b><small>Blowouts</small></div>
      <div><b>${workouts}</b><small>Workouts this season</small></div><div><b>${Math.round(Math.min(1, workouts/possible)*100)}%</b><small>Consistency</small></div><div><b>${reps.toLocaleString()}</b><small>Total reps &amp; seconds</small></div></div>
      <div class="hg">${st.rows.map(r => {
        const g = r.game; let res = '', col = '#2B5560', sc = '';
        if (r.state === 'final' && g){ const won = g.sa > g.sb, tie = g.sa === g.sb; res = tie ? 'Tie' : won ? (g.boA ? 'Blowout' : 'Win') : 'Loss'; col = tie ? 'var(--tie)' : won ? (g.boA ? 'var(--bo)' : 'var(--win)') : 'var(--loss)'; sc = `${g.sa}–${g.sb}${g.ot ? ' OT' : ''} vs ${esc(r.opp)}`; }
        else if (r.state === 'live'){ res = 'This week'; col = 'var(--soft)'; sc = 'vs ' + esc(r.opp); }
        else { res = '–'; sc = 'vs ' + esc(r.opp); }
        return `<div class="hw" style="--rc:${col}"><div class="wn">${r.short}<small>${fmtDate(fromKey(r.ws))}</small></div>${[0,1,2].map(i => mini(r.sess[i])).join('')}<div class="res"><b>${res}</b><small>${sc}</small>${st.league3 && r.state === 'final' && g ? `<button class="link" style="font-size:11.5px" data-replay="${st.s.id}|${r.w}">Replay</button>` : ''}</div></div>`;
      }).join('')}</div>`;
  } else body = `<p>No seasons yet. Your workouts are still logged and earning money. Start a season to see weekly results here.</p>`;
  openSheet(head('History') +
    (seasons.length > 1 ? `<div class="seas">${seasons.map((s,i) => `<button class="chip ${s.id === id ? 'on' : ''}" data-hs="${s.id}">Season ${i+1}: ${esc(s.team)}</button>`).join('')}</div>` : '') +
    body +
    `<h3>Trophy case</h3>${titles.length ? `<div class="trophy">${titles.map(t => `<span>🏆 ${esc(t.s.team)} · ${new Date(t.s.createdAt).getFullYear()} · ${t.me.w}–${t.me.l}–${t.me.t}</span>`).join('')}</div>` : '<p class="muted">Empty for now. Win a championship and it lives here forever.</p>'}
    <p class="muted" style="font-size:13px;margin-top:14px">Each small graph is one workout: five bars for push, pull, legs, core and hinge, sized against your target. Total workouts logged all time: ${data.sessions.length}.</p>`);
}

/* sync */
let pendingImport = null;
function exportText(){ return JSON.stringify({app:'fifteen', v:2, exportedAt:new Date().toISOString(), data}); }
function renderSync(){
  const newest = data.sessions.length ? data.sessions[data.sessions.length-1].d : null;
  openSheet(head('Sync') + `<div class="sync">
    <p>Move your progress between devices: export here, then import on the other device. Your workouts, lineup, seasons, team, wallet and trophies all travel together.</p>
    <div class="stamps"><div><b>${fmtDT(data.meta.lastExport)}</b><small>Last exported</small></div><div><b>${fmtDT(data.meta.lastImport)}</b><small>Last imported</small></div></div>
    <p class="muted" style="font-size:13.5px">This device: ${data.sessions.length} workouts${newest ? ', newest ' + fmtDT(newest) : ''}, ${data.seasons.length} season${data.seasons.length===1?'':'s'}.</p>
    <h3>Export data</h3>
    <div class="row"><button class="btn sm" id="exCopy">Copy export text</button><button class="btn sm ghost" id="exFile">Download file</button></div>
    <h3>Import data</h3>
    <textarea id="imTxt" spellcheck="false" placeholder="Paste export text here, or choose a file"></textarea>
    <div class="row"><button class="btn sm" id="imCheck">Check import</button><label class="btn sm ghost" style="cursor:pointer">Choose file<input type="file" id="imFile" accept=".json,.txt,application/json,text/plain" hidden></label></div>
    <div id="imResult"></div>
    <h3>Update the app on Google Sites</h3>
    <div class="row"><button class="btn sm ghost" id="codeCopy">Copy app code</button></div>
    <p class="muted" style="font-size:13px;margin-top:8px">Copies this whole app so you can paste it into a Google Sites embed. Your data stays where it is.</p></div>`);
  $('exCopy').onclick = () => copy(exportText(), () => { data.meta.lastExport = Date.now(); save(); renderSync(); toast('Export copied. Paste it into the Import box on your other device.'); });
  $('exFile').onclick = () => { try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([exportText()], {type:'application/json'})); a.download = `fifteen-backup-${dkey(new Date())}.json`; document.body.appendChild(a); a.click(); a.remove(); data.meta.lastExport = Date.now(); save(); renderSync(); toast('Export downloaded.'); } catch(e){ toast("Downloads are blocked here. Use Copy export text instead."); } };
  $('imFile').onchange = e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { $('imTxt').value = r.result; checkImport(); }; r.readAsText(f); };
  $('imCheck').onclick = checkImport;
  $('codeCopy').onclick = () => copy(SOURCE, () => toast('App code copied. In Google Sites, edit the embed and paste it in.'));
}
function checkImport(){
  let inc = null;
  try { const o = JSON.parse($('imTxt').value);
    if (o && o.app === 'fifteen' && o.data) inc = normalize(o.data);
    else if (o && Array.isArray(o.sessions) && o.v === 2) inc = normalize(o);
    else if (o && Array.isArray(o.sessions)) { inc = blank(); inc.sessions = convertV1(o); inc = normalize(inc); }
  } catch(e){}
  if (!inc){ $('imResult').innerHTML = '<div class="warn">That text isn\'t a Fifteen export. Copy the full export text and try again.</div>'; return; }
  pendingImport = inc;
  const lnew = data.sessions.length ? data.sessions[data.sessions.length-1].d : '';
  const inew = inc.sessions.length ? inc.sessions[inc.sessions.length-1].d : '';
  const localIds = new Set(data.sessions.map(s=>s.id)); const onlyLocal = data.sessions.filter(s => !new Set(inc.sessions.map(x=>x.id)).has(s.id)).length;
  const newOnes = inc.sessions.filter(s => !localIds.has(s.id)).length;
  const risky = onlyLocal > 0 || lnew > inew || data.updatedAt > inc.updatedAt;
  $('imResult').innerHTML = `<div class="warn"><b>Import:</b> ${inc.sessions.length} workouts${inew ? ', newest ' + fmtDT(inew) : ''}, ${inc.seasons.length} season${inc.seasons.length===1?'':'s'}.<br>
    <b>This device:</b> ${data.sessions.length} workouts${lnew ? ', newest ' + fmtDT(lnew) : ''}.<br>
    Merging adds ${newOnes} workout${newOnes===1?'':'s'} and keeps everything already here.${risky ? `<br><b>Heads up:</b> this device has ${onlyLocal} workout${onlyLocal===1?'':'s'} or newer changes the import doesn't. Replacing would erase them.` : ''}</div>
    <div class="row"><button class="btn sm" id="imMerge">Merge (recommended)</button><button class="btn sm ghost" id="imReplace">Replace this device's data</button></div>`;
  $('imMerge').onclick = () => applyImport('merge');
  $('imReplace').onclick = () => { if (!risky || confirm(`Replace all data on this device? ${onlyLocal} workout${onlyLocal===1?'':'s'} only on this device will be lost.`)) applyImport('replace'); };
}
function applyImport(how){
  const inc = pendingImport; if (!inc) return;
  const keepExport = data.meta.lastExport;
  if (how === 'replace') data = inc;
  else {
    const byId = (a,b) => { const m = new Map(); a.concat(b).forEach(x => m.set(x.id, x)); return [...m.values()]; };
    data.sessions = byId(inc.sessions, data.sessions); data.spends = byId(inc.spends, data.spends);
    data.seasons = byId(inc.seasons, data.seasons).sort((a,b) => (a.createdAt||0) - (b.createdAt||0));
    const km = new Map(); (inc.kickoffs||[]).concat(data.kickoffs||[]).forEach(k => { const key = k.sid + '|' + k.w; const o = km.get(key); if (!o || k.at < o.at) km.set(key, k); }); data.kickoffs = [...km.values()];
    if ((inc.prefs.prefsAt||0) > (data.prefs.prefsAt||0)) data.prefs = Object.assign({}, inc.prefs, {seen: [...new Set([...(inc.prefs.seen||[]), ...(data.prefs.seen||[])])]});
    data = normalize(data);
  }
  data.meta.lastImport = Date.now(); data.meta.lastExport = keepExport;
  save(); pendingImport = null; renderAll(); renderSync(); toast(how === 'merge' ? 'Merged. Nothing on this device was lost.' : 'Data replaced.');
}
function copy(text, done){
  const fallback = () => { const t = document.createElement('textarea'); t.value = text; t.style.position = 'fixed'; t.style.opacity = '0'; document.body.appendChild(t); t.select(); let ok = false; try { ok = document.execCommand('copy'); } catch(e){} t.remove(); ok ? done() : toast('Copy was blocked. Select the text and press ⌘C.'); };
  if (navigator.clipboard && window.isSecureContext !== false) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
}

/* celebration */
function celebrate(st){
  openSheet(`<div class="champ"><div class="cup">🏆</div><h2>Champions.</h2><p style="font-size:18px">The <b>${esc(st.s.team)}</b> win the title with a ${st.me.w}–${st.me.l}–${st.me.t} season and ${st.me.bo} blowout${st.me.bo===1?'':'s'}.</p>
    <p style="margin-top:8px">Built one fifteen-minute session at a time. This one goes in the trophy case for good.</p>
    <div class="row" style="justify-content:center;margin-top:18px"><button class="btn" data-close>Hang the banner</button></div></div>`, true);
  bell(784,0,1.4,.26); bell(987.8,.15,1.4,.26); bell(1174.7,.3,1.6,.26); bell(1568,.45,2,.26);
  const c = $('confetti'), x = c.getContext('2d'); c.width = innerWidth; c.height = innerHeight;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cols = ['#6EE7B7','#F6C344','#FF7A59','#5EC8F2','#B69CFF', TEAM[st.s.team].color];
  const ps = Array.from({length:180}, () => ({x:Math.random()*c.width, y:-20-Math.random()*c.height*.5, vx:(Math.random()-.5)*3, vy:2+Math.random()*4, r:Math.random()*6, s:4+Math.random()*6, c:pick(Math.random, cols)}));
  const t0 = performance.now();
  (function f(now){ x.clearRect(0,0,c.width,c.height); ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.r += .1; x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); x.restore(); });
    if (now - t0 < 5000) requestAnimationFrame(f); else x.clearRect(0,0,c.width,c.height); })(t0);
}

/* ================= wiring ================= */
$('sheetCard').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.goto === 'setup'){ closeSheet(); pickTeam = null; renderSetup(); show('setup'); }
  if (b.dataset.hs){ histSeason = b.dataset.hs; renderHistory(); }
  if (b.dataset.tab){ leagueTab = b.dataset.tab; renderLeague(); }
  if (b.dataset.tm){ openTeam(b.dataset.tm, 'league'); return; }
  if (b.dataset.back){ renderLeague(); return; }
  if (b.dataset.box){ const [w,a,bb] = b.dataset.box.split('|'); closeSheet(); openGame({kind:'replay', s:seasonState().s, w:+w, a, b:bb, playoff:+w > 15, cnt:0}); }
  if (b.dataset.replay){ const [sid,w] = b.dataset.replay.split('|'); const s = data.seasons.find(x => x.id === sid); if (s){ closeSheet(); openUserGame(simSeason(s), +w, 'replay'); } }
});
$('recBtn').onclick = renderLeague; $('leagueBtn').onclick = renderLeague; $('histBtn').onclick = () => { histSeason = null; renderHistory(); };
$('syncBtn').onclick = renderSync; $('walletBtn').onclick = renderWallet;
$('fsTop').onclick = toggleFS; $('fsWork').onclick = toggleFS;
$('pauseBtn').onclick = pause; $('skipBtn').onclick = skip;
$('endBtn').onclick = () => { if (confirm('End now and log what you did?')) finish(false); };
$('soundBtn').onclick = () => { data.prefs.sound = !data.prefs.sound; save(); syncToggles(); if (data.prefs.sound) SND.ten(); };
$('voiceBtn').onclick = () => { data.prefs.voice = !data.prefs.voice; save(); syncToggles(); };
document.addEventListener('keydown', e => {
  if (/INPUT|TEXTAREA/.test(e.target.tagName)) return;
  if (e.key === 'Escape' && $('sheet').classList.contains('on')) return closeSheet();
  if (view !== 'work') return;
  if (e.code === 'Space'){ e.preventDefault(); pause(); }
  if (e.code === 'ArrowRight') skip();
  if (e.code === 'KeyF') toggleFS();
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && running) lockWake(); });
let tt; function toast(m){ const t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 3800); }

function renderAll(){
  renderTop();
  if (view === 'home') renderHome();
  const st = seasonState();
  if (st && st.status === 'champion' && !data.prefs.seen.includes(st.s.id)){ data.prefs.seen.push(st.s.id); save(); celebrate(st); }
}
setColor('#6EE7B7');
if (!data.seasons.length && !data.prefs.skippedSetup){ renderSetup(); show('setup'); renderTop(); }
else { show('home'); renderAll(); }
if (!store) setTimeout(() => toast('This browser is blocking saved data here. Use Sync to export after each workout.'), 800);
else if (IS_POP) setTimeout(() => toast('Press Full screen to fill the display, then Start.'), 600);
})();
</script>
</body>
